name: marsky
description: Marsky take-home challenge
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  supabase_flutter: ^2.8.4
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/media/illustrations/
    - assets/media/icons/
    - assets/media/coin_icons/
    - lib/media/assets-manifest.json
    - lib/media/svg/
    - lib/media/svg/icons/
    - lib/media/svg/illustrations/
    - lib/media/svg/crypto/
